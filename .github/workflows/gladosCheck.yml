name: GLaDOS Check-in

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
      - 'THIRD_PARTY_NOTICES.md'
  schedule:
    # UTC: Beijing 09:18.
    - cron: '18 1 * * *'

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados checkin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Verify check-in and exchange handling
      run: python -m unittest discover -s tests -v

    - name: Running checkin
      run: python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES_V2 || secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN || vars.GLADOS_EXCHANGE_PLAN || 'plan500' }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE || vars.GLADOS_VERBOSE }}

    - name: Keep scheduled workflow active
      if: ${{ !cancelled() }}
      uses: liskin/gh-workflow-keepalive@v1
